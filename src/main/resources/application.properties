spring.application.name=aula12.persistencia
# Configuração do banco de dados (neste caso o H2)
spring.datasource.url=jdbc:h2:file:./data/aula12db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Atualização automática das tabelas
spring.jpa.hibernate.ddl-auto=update

# Exibir os comandos SQL no console
spring.jpa.show-sql=true
